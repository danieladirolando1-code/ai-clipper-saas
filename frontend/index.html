<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlipAI - AI Video Clipper Indonesia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Klip<span>AI</span></h1>
            <p>Ubah Video YouTube Panjang Jadi Klip Vertikal Viral Siap Upload dalam Hitungan Menit</p>
        </header>

        <main>
            <div class="input-card">
                <input type="text" id="ytUrl" placeholder="Tempelkan Link YouTube di sini (cth: https://www.youtube.com/watch?v=...)" />
                <button id="generateBtn" onclick="processVideo()">Potong Video Sekarang</button>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p id="statusText">Sedang mengunduh audio & membaca transkrip AI...</p>
            </div>

            <div id="resultSection" class="hidden">
                <h2>Klip Hasil AI:</h2>
                <div id="clipsGrid" class="clips-grid"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
